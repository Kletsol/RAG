[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "bm25s>=0.3.10",
    "fire>=0.7.1",
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "sentence-transformers>=6.0.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.2.0",
]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fire", "bm25s"]
ignore_missing_imports = true